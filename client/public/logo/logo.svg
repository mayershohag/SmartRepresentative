<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170F2C"/>
      <stop offset="1" stop-color="#0C0918"/>
    </linearGradient>
    <!-- Exact brand thread: matches the dashboard's thread pink, violet, and blue tokens -->
    <linearGradient id="thread" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0"   stop-color="#EC4899"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1"   stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- Route: Distributor -> Delivery -> Shopkeeper, one continuous smooth path -->
  <path d="M 176,140 C 176,198 256,198 256,256 C 256,314 336,314 336,372"
        fill="none" stroke="url(#thread)" stroke-width="32"
        stroke-linecap="round"/>

  <!-- Waypoint node (Delivery) -->
  <circle cx="256" cy="256" r="30" fill="#150F26"/>
  <circle cx="256" cy="256" r="22" fill="#8B5CF6"/>

  <!-- Endpoint nodes: Distributor (pink) / Shopkeeper (blue) -->
  <circle cx="176" cy="140" r="34" fill="#150F26"/>
  <circle cx="176" cy="140" r="25" fill="#EC4899"/>

  <circle cx="336" cy="372" r="34" fill="#150F26"/>
  <circle cx="336" cy="372" r="25" fill="#3B82F6"/>
</svg>
